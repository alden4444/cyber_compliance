name: Build Compliance Audit Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin_name: RoamComplianceAudit-windows.exe
            dist_path: dist/RoamComplianceAudit-windows.exe
            pyinstaller_cmd: pyinstaller --onefile --name RoamComplianceAudit-windows pc_audit.py
          - os: macos-latest
            bin_name: RoamComplianceAudit-macos
            dist_path: dist/RoamComplianceAudit-macos
            pyinstaller_cmd: pyinstaller --onefile --name RoamComplianceAudit-macos pc_audit.py
          - os: ubuntu-latest
            bin_name: RoamComplianceAudit-linux
            dist_path: dist/RoamComplianceAudit-linux
            pyinstaller_cmd: pyinstaller --onefile --name RoamComplianceAudit-linux pc_audit.py

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Standalone Binary
        run: ${{ matrix.pyinstaller_cmd }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin_name }}
          path: ${{ matrix.dist_path }}

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.dist_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
